[package]
name = "arzamas"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "migration", "entity"]

[lib]
path = "src/lib.rs"
name = "lib"

[[bin]]
path = "src/main.rs"
name = "bin"

[dependencies]
actix-web = "4.9"
actix-http = "3.9"
actix-files = "0.6"
actix-service = "2.0"

dotenv = "0.15"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
jsonwebtoken = "9"

futures = "0.3"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }

tracing = { version = "0.1", features = ["log"] }
tracing-actix-web = "0.7"
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }

redis = { version = "0.27", features = ["tokio-comp", "tokio-native-tls-comp", "connection-manager"] }
deadpool-redis = "0.18.0"

chrono = "0.4"
hex = "0.4"
sha2 = "0.10"
regex = "1.1"
argon2 = "0.5"
lazy_static = "1"
unicode-normalization = "0.1"
getrandom = "0.2"
tokio-async-std = "1.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
totp-rs = "5"
qrcode = "0.14"
base32 = "0.5"
url = "2.5"

entity = { path = "entity" }
migration = { path = "migration" }

utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["actix-web"] }
utoipa-rapidoc = { version = "5", features = ["actix-web"] }
async-trait = "0.1"
mime_guess = "2"

[dependencies.sea-orm]
version = "1"
default-features = true
features = ["default", "with-json", "macros", "sqlx-postgres", "runtime-actix-rustls", "chrono", "postgres-array"]

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[dependencies.lettre]
version = "0.11"
default-features = false
features = [
    "smtp-transport",
    "tokio1",
    "native-tls",
    "tokio1-native-tls",
    "hostname",
    "builder",
    "tracing",
]
